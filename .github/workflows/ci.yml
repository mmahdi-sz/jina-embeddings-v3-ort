name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-impl

      - name: Cargo Check
        run: cargo check --manifest-path rust-impl/Cargo.toml

      - name: Cargo Unit & Doc Tests
        run: cargo test --manifest-path rust-impl/Cargo.toml

      - name: Cargo Clippy
        run: cargo clippy --manifest-path rust-impl/Cargo.toml -- -D warnings

      - name: Cargo Doc
        run: cargo doc --manifest-path rust-impl/Cargo.toml --no-deps

      - name: Verify crates.io Package Dry-Run
        run: |
          cd rust-impl
          cargo publish --dry-run
