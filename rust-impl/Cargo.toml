[package]
name = "jina-embeddings-v3-ort"
version = "0.1.0"
edition = "2021"
description = "High-performance standalone Rust inference engine for jinaai/jina-embeddings-v3 using ORT (ONNX Runtime)"
license = "MIT OR Apache-2.0"

[dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls", "copy-dylibs"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"

[[bin]]
name = "parity_test"
path = "src/bin/parity_test.rs"
