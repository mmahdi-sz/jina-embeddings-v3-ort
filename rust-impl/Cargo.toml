[package]
name = "jina-embeddings-v3-ort"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Mahdi <mmahdi.sz@gmail.com>"]
description = "Rust ONNX Runtime inference for jina-embeddings-v3 with task-LoRA routing and verified numerical parity"
license = "MIT"
repository = "https://github.com/mmahdi-sz/jina-embeddings-v3-ort"
homepage = "https://github.com/mmahdi-sz/jina-embeddings-v3-ort"
documentation = "https://docs.rs/jina-embeddings-v3-ort"
readme = "README.md"
keywords = ["embeddings", "onnx", "nlp", "jina", "multilingual"]
categories = ["science::ml", "text-processing"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE"
]

[dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls", "copy-dylibs"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"

[[bin]]
name = "parity_test"
path = "src/bin/parity_test.rs"

[[bin]]
name = "benchmark_300"
path = "src/bin/benchmark_300.rs"

[[bin]]
name = "suite1_rag_benchmark"
path = "src/bin/suite1_rag_benchmark.rs"

[[bin]]
name = "suite2_edge_cases"
path = "src/bin/suite2_edge_cases.rs"

[[bin]]
name = "suite3_concurrency"
path = "src/bin/suite3_concurrency.rs"

[[bin]]
name = "suite4_matryoshka"
path = "src/bin/suite4_matryoshka.rs"

[[bin]]
name = "suite5_memory_longevity"
path = "src/bin/suite5_memory_longevity.rs"

[[bin]]
name = "benchmark_two_stage_hybrid"
path = "src/bin/benchmark_two_stage_hybrid.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
